name: Auto Release with Executables

# Tests : une seule fois, sur la branche de travail (4 jobs en parallèle) avant le squash-merge.
# Sur main : builds + release seulement (l'arbre est celui de la branche testée) ; le site est publié par pages.yml.
on:
  push:
    branches:
      - main
      - 'travail-*'
    paths-ignore:          # documentation seule : ni tests, ni release
      - '**.md'
      - 'claude/**'
  workflow_dispatch:

jobs:
  tests:
    name: Tests ${{ matrix.groupe }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.ref != 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        groupe: [base, croise-a, croise-b, piege]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
          pip install requests
          cd tests/web && npm install --no-audit --no-fund
      - name: Banc de test (relancé une fois en cas d'échec ponctuel)
        env:
          PY: python
          CHROME: /usr/bin/google-chrome
          GROUPE: ${{ matrix.groupe }}
        run: tests/lancer_tests.sh || (mkdir -p /tmp/essai1 && cp -r /tmp/t*.txt /tmp/sc /tmp/fb_refus.log /tmp/essai1/ 2>/dev/null; echo "Nouvel essai…" && tests/lancer_tests.sh)
      - name: Journaux en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journaux-tests-${{ matrix.groupe }}
          path: |
            /tmp/t*.txt
            /tmp/sc/
            /tmp/fb_refus.log
            /tmp/essai1/

  build:
    # Windows seulement : un seul fichier SMOUT.X.Y.exe par release
    if: github.ref == 'refs/heads/main'
    name: Build Windows
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version Name
        id: vars
        shell: bash
        run: |
          SUMMARY=$(git log -1 --pretty=%s)
          # Nom du fichier : SMOUT.X.Y (caractères interdits retirés, espaces remplacés par des points)
          SAFE_NAME=$(echo "SMOUT.$SUMMARY" | sed 's/[<>:"/\\|?*]//g; s/ /./g')
          echo "full_name=$SAFE_NAME" >> $GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller requests
        shell: bash

      - name: Build with PyInstaller (Windows)
        run: |
          python -m PyInstaller --noconsole --onefile --add-data "fichiers;fichiers" --icon="fichiers/logo.ico" --name "${{ steps.vars.outputs.full_name }}" main.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: dist/${{ steps.vars.outputs.full_name }}.exe
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Commit Info
        id: vars
        run: |
          SUMMARY=$(git log -1 --pretty=%s)
          DESCRIPTION=$(git log -1 --pretty=%b)
          CLEAN_TAG=$(echo "$SUMMARY" | sed 's/ /_/g')
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT
          echo "tag=$CLEAN_TAG" >> $GITHUB_OUTPUT
          echo "description<<EOF" >> $GITHUB_OUTPUT
          echo "$DESCRIPTION" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ steps.vars.outputs.summary }}
          body: ${{ steps.vars.outputs.description }}
          files: release-files/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}