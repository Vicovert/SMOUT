name: Version web (GitHub Pages)

# Le site est publié dès le push sur main (les tests ont déjà tourné sur la branche de travail avant le squash-merge)
on:
  push:
    branches: [main]
    paths-ignore:          # documentation seule : pas de republication
      - '**.md'
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url || steps.deploiement2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construire la version web
        run: python outils/export_web.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      # GitHub ne voit parfois pas encore l'artefact juste après l'envoi (« Found 0 artifact ») : 2e essai 20 s plus tard
      - name: Publier
        id: deploiement
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Attendre avant le 2e essai
        if: steps.deploiement.outcome == 'failure'
        run: sleep 20
      - name: Publier (2e essai)
        id: deploiement2
        if: steps.deploiement.outcome == 'failure'
        uses: actions/deploy-pages@v5
